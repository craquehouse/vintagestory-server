# Draft git-cliff configuration (Story 15.0 spike). Story 15.3 moves the final version to the repository root.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are listed here. Versions follow [Semantic Versioning](https://semver.org).
<!-- git-cliff: end of header -->
"""
header_marker = "<!-- git-cliff: end of header -->"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope and commit.scope in ["api", "web", "docker"] %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/craquehouse/vintagestory-server/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Scopes are hidden in the template except an allowlist of components, so BMAD
# story/task/review scopes never appear.
commit_preprocessors = []
protect_breaking_commits = true
commit_parsers = [
    { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking Changes" },
    # Safety net for BMAD bookkeeping typed feat/fix: preparation (X.0) stories and status moves
    { field = "scope", pattern = '^story-[0-9]+\.0(/|$)', skip = true },
    { message = '(move|moves|moved) story [0-9.]+ to review', skip = true },
    { message = "^feat", group = "<!-- 1 -->Features" },
    { message = "^fix", group = "<!-- 2 -->Fixes" },
    { message = "^perf", group = "<!-- 3 -->Performance" },
    { message = ".*", skip = true },
]
filter_commits = true
# Stable versions only: pre-release tags are invisible, so stable notes and bumps cover everything since the last stable release.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order_commits = true
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
