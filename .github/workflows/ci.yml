name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    # The release commit only changes version numbers; the tag's release workflow builds it
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(release): ') }}"
    runs-on: ubuntu-latest
    env:
      # Placeholder required by the settings model; not a real credential.
      VS_API_KEY_ADMIN: ci-placeholder-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: just build-api
      - run: just lint-api
      - run: just typecheck-api
      - run: just test-api

  web:
    name: Web tests and build
    # The release commit only changes version numbers; the tag's release workflow builds it
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(release): ') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: just install-web --frozen-lockfile
      - run: just lint-web
      - run: just typecheck-web
      - run: just test-web
      - run: just build-web

  scripts:
    name: Release scripts
    # The release commit only changes version numbers; the tag's release workflow builds it
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(release): ') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: just version
      - run: just lint-scripts
      - run: just lint-workflows
      - run: just test-scripts

  docker:
    name: Docker image
    # The release commit only changes version numbers; the tag's release workflow builds it
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(release): ') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E tests
    # The release commit only changes version numbers; the tag's release workflow builds it
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(release): ') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The image the recipe starts; built below and never pushed
      E2E_IMAGE: vintagestory-server:e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Reads the layer cache the docker job writes; writes none, so the two jobs never race
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.E2E_IMAGE }}
          cache-from: type=gha
      - run: just install-web --frozen-lockfile
      - run: just build-api
      # The key is the runner's system and the two Playwright versions, not the lock files,
      # so an unrelated dependency update keeps the cache
      - id: playwright
        # An assignment, so a failing `just playwright-versions` fails the step (bash -e)
        # instead of writing a partial key that would miss the cache without a word
        run: |
          versions="$(just playwright-versions)"
          echo "key=playwright-${ImageOS:?}-$RUNNER_ARCH-$versions" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}
      # Downloads only what the cache did not restore; --with-deps still installs system packages
      - run: just install-e2e-browsers
      # Placeholder keys and the seeded fixture only (scripts/e2e-ci.sh); no secret
      - run: just test-e2e-ci
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
            web/playwright-report-moddb/
            web/test-results-moddb/
          if-no-files-found: ignore
          retention-days: 7

  semgrep:
    name: Semgrep
    # The release commit only changes version numbers; the tag's release workflow builds it
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(release): ') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that may write code scanning results; the workflow default stays contents: read
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --baseline-commit needs the merge base with main, which a depth-1 checkout lacks
          fetch-depth: 0
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      # Pull request: fail only on a finding the pull request adds
      - if: ${{ github.event_name == 'pull_request' }}
        run: just semgrep --baseline-commit "$(git merge-base origin/main HEAD)"
      # main and manual runs: scan everything, report to code scanning, never fail on a finding
      - if: ${{ github.event_name != 'pull_request' }}
        run: just semgrep --sarif-output=semgrep.sarif
        env:
          SEMGREP_REPORT_ONLY: "1"
      - if: ${{ github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
